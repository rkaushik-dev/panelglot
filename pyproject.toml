[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "v4t-translate"
version = "0.1.0"
description = "Localisation toolchain for the V4T thermal inkjet coder family"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ming", email = "ming@sellenis.com" }]

dependencies = [
    "click==8.1.7",
    "openpyxl==3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.4.9",
]

[project.scripts]
v4t-translate = "v4t_translate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/v4t_translate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
