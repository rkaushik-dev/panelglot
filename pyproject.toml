[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "v4t-translate"
version = "0.2.0"
description = "Localisation toolchain for the V4T thermal inkjet coder family"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ming", email = "ming@sellenis.com" }]

dependencies = [
    "click==8.1.8",
    "openpyxl==3.1.5",
    "tomli==2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.9.6",
    "mypy==1.15.0",
]

[project.scripts]
v4t-translate = "v4t_translate.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/v4t_translate"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # The rc grammar genuinely has a lot of branches and splitting them into
    # helpers made it harder to follow, not easier.
    "SIM102",
    # Ambiguous unicode is the subject matter. A full width colon next to an
    # ASCII one is the thing being tested, and flagging it flags the whole
    # Taiwan side of this project.
    "RUF001",
    "RUF002",
    "RUF003",
    # __all__ is ordered by what the module is for, not alphabetically.
    "RUF022",
    "RUF023",
]

[tool.ruff.lint.per-file-ignores]
# Tests say the same thing many ways on purpose.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/v4t_translate"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["v4t_translate"]

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
