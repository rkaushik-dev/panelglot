name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"

      - name: ruff
        run: ruff check --output-format=github .

      - name: mypy
        run: mypy src/v4t_translate

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The tool is run on the panel build machines, which are Windows,
          # and the encoding and path handling only ever break there.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"

      - name: pytest
        run: >-
          pytest
          --junitxml=reports/pytest-${{ matrix.os }}-${{ matrix.python-version }}.xml
          --cov=v4t_translate
          --cov-report=term-missing:skip-covered
          --cov-report=xml:reports/coverage.xml

      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

  selfcheck:
    # Against a built wheel rather than the checkout. The unit tests import
    # from src/ and pass on a machine where the installed package is broken:
    # an entry point that was never registered, a module missing from the
    # wheel, a data file nobody added to the manifest. This is the only job
    # that can see any of that.
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: build a wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: install it, and nothing else
        shell: bash
        run: python -m pip install dist/*.whl

      - name: the console script is installed and runs
        run: v4t-translate --version

      - name: every command has help
        shell: bash
        run: |
          for command in init status extract adopt check export import build pretranslate stats doctor memory diff font verify pack-diff audit prune; do
            v4t-translate "$command" --help > /dev/null
          done

      - name: one round, start to finish
        run: python tools/selfcheck.py

      - name: the worked example config parses
        # It is the config everybody copies, and a broken one costs a day.
        run: >-
          python -c "from v4t_translate.config import load_config;
          c = load_config('v4t-translate.toml');
          print(c.name, c.target_tags())"
